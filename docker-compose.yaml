services:
  backend:
    build:
      context: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "${BACKEND_PORT}:8000"
    volumes:
      - .:/app

  frontend:
    build:
      context: ../Front-End
    restart: unless-stopped
    env_file: ../Front-End/.env
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ../Front-End:/app
      - /app/node_modules

