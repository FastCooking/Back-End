name: CI - Backend

on:
  push:
    branches:
      - main
      - develop
      - dev
  pull_request:
    branches:
      - main
      - develop
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-dev:
    name: Lint & Test (Dev)
    if: >-
      ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/dev')) ||
      (github.event_name == 'pull_request' &&
      (github.base_ref == 'develop' || github.base_ref == 'dev'))
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: fastcooking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    environment: Devlopment

    env:
      DATABASE_URL: postgresql+psycopg://test_user:test_password@localhost:5432/fastcooking_test
      SECRET_KEY: ${{ secrets.SECRET_KEY || vars.SECRET_KEY || 'ci-dev-secret-key' }}
      JWT_SECRET: ${{ secrets.JWT_SECRET || vars.JWT_SECRET || 'ci-dev-jwt-secret' }}
      BCRYPT_ROUNDS: ${{ vars.BCRYPT_ROUNDS || secrets.BCRYPT_ROUNDS || '12' }}
      SERVER_PORT: ${{ vars.SERVER_PORT || secrets.SERVER_PORT || '8000' }}
      APP_ENV: ${{ vars.APP_ENV || 'development' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Rodar lint
        run: ruff check .

      - name: Rodar migrações
        run: alembic -c alembic.ini upgrade head

      - name: Rodar testes
        run: pytest

  test-prod:
    name: Lint & Test (Prod)
    if: >-
      ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: fastcooking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    environment: ${{ github.ref == 'refs/heads/main' && 'Production' || '' }}

    env:
      DATABASE_URL: postgresql+psycopg://test_user:test_password@localhost:5432/fastcooking_test
      SECRET_KEY: ${{ secrets.SECRET_KEY || vars.SECRET_KEY || 'ci-prod-test-secret-key' }}
      JWT_SECRET: ${{ secrets.JWT_SECRET || vars.JWT_SECRET || 'ci-prod-test-jwt-secret' }}
      BCRYPT_ROUNDS: ${{ vars.BCRYPT_ROUNDS || secrets.BCRYPT_ROUNDS || '12' }}
      SERVER_PORT: ${{ vars.SERVER_PORT || secrets.SERVER_PORT || '8000' }}
      APP_ENV: ${{ vars.APP_ENV || 'production' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Rodar lint
        run: ruff check .

      - name: Rodar migrações
        run: alembic -c alembic.ini upgrade head

      - name: Rodar testes
        run: pytest
